<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BUDDY SEARCH</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="index.js?v=2"></script>
  <link rel="stylesheet" href="style2.css">
</head>

<body>

  <div id="viewfinder">
  <div id="top-icons">
    <div class="hud-rec">
      <p id="clock"></p>
    </div>
    <div class="hud-top-right">
      <p class="bat-percent">84%</p>

      <img class = "battery" src="assets/battery.svg">
    </div>
  </div>
  <div class="bottom-date">
    <p id="date"></p>
  </div>

  <div class="hud-menu">
    <img src = "assets/etilogo.svg"/>
  </div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div >
    <img id="center" src="assets/eye.svg">
  </div>
</div>
  <a-scene embedded vr-mode-ui="enabled: false;"
    arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-entity camera></a-entity>

  </a-scene>
  
  <script src="markerGenerator.js"></script>
  <script src="index.js"></script>
</body>

</html>
