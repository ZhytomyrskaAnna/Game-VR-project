<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Гра з Призами</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="index.js"></script>

  <link rel="stylesheet" href="style.css">
  
</head>

<body>

  <div id="viewfinder">
  <div id="top-icons">
    <div class="hud-rec">
      <span class="rec-dot"></span> REC
    </div>
    <div class="hud-top-right">
      <span class="battery">
        <span class="battery-level"></span>
      </span>
      <span class="bat-percent">84%</span>
    </div>
  </div>
  <!-- Bottom Center -->
  <div class="hud-timer">00:00:20:05</div>

  <!-- Bottom Right -->
  <div class="hud-menu">MENU ☰</div>

  <!-- FRAME CORNERS -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="center-crosshair"></div>
</div>
  <a-scene embedded vr-mode-ui="enabled: false;"
    arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-entity camera></a-entity>

  </a-scene>
  
  <script src="markerGenerator.js"></script>
</body>

</html>
